<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/app-icon-DOlPhHkP.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>《物語手帳》</title>
    <meta name="description" content="《物語手帳》一體化跑團助手：NPC 工坊、免翻書角色卡、戰鬥房間連線與命刻系統" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-C2WJTbV1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-l16l7Ro3.css">
  </head>
  <body class="bg-[#fbf7ee] text-[#2c221e] antialiased selection:bg-[#a63d40]/20 selection:text-[#2c221e] overflow-x-hidden min-h-screen" style="background-color: #fbf7ee; color: #2c221e; margin: 0;">
    <div id="root">
      <style>
        @keyframes fuInitialLoadingSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
          .fu-initial-loading-bar { animation: none !important; transform: none !important; }
        }
      </style>
      <div
        role="status"
        aria-live="polite"
        style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box; background-color: #fbf7ee; color: #2c221e; user-select: none; font-family: 'Cinzel', 'Noto Serif TC', Georgia, serif;"
      >
        <div style="font-size: 14px; font-weight: 700; color: #3c2415; letter-spacing: 0.1em; margin-bottom: 12px;">
          《物語手帳》
        </div>
        <div style="width: 280px; max-width: 85vw; height: 8px; background-color: #e8dcc4; border: 1px solid #d6c7ab; border-radius: 2px; overflow: hidden; padding: 2px; box-sizing: border-box;">
          <div
            class="fu-initial-loading-bar"
            style="width: 40%; height: 100%; background-color: #a63d40; border-radius: 2px; animation: fuInitialLoadingSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;"
          ></div>
        </div>
        <p
          id="fu-initial-loading-msg"
          style="margin: 12px 0 0 0; font-size: 12px; line-height: 1.6; color: #6b5a4b; letter-spacing: 0.05em;"
        >
          正在繪製圖紙……
        </p>
      </div>
      <script>
        (function () {
          var msgs = [
            '正在繪製圖紙……',
            '正在雕刻棋子……',
            '正在冶煉金屬……',
            '正在構造世界……'
          ];
          var idx = 0;
          var timer = setInterval(function () {
            var el = document.getElementById('fu-initial-loading-msg');
            if (!el) {
              clearInterval(timer);
              return;
            }
            idx = (idx + 1) % msgs.length;
            el.textContent = msgs[idx];
          }, 1600);
        })();
      </script>
    </div>
  </body>
</html>
